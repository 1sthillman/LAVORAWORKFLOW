<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Test: .XLS Görsel Çıkarma</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      max-width: 900px; 
      margin: 40px auto; 
      padding: 20px;
      background: #f5f5f5;
    }
    .log { 
      background: #1e1e1e; 
      color: #d4d4d4; 
      padding: 20px; 
      border-radius: 8px; 
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin: 20px 0;
      max-height: 400px;
      overflow-y: auto;
    }
    .log .success { color: #4ec9b0; }
    .log .error { color: #f48771; }
    .log .info { color: #9cdcfe; }
    .log .warn { color: #dcdcaa; }
    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 10px 10px 0;
    }
    button:hover { background: #006cc1; }
    .images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .img-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .img-card img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .img-card .info {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
      border: 2px dashed #0078d4;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🖼️ .XLS Görsel Çıkarma Testi</h1>
  <p>Bu test, eski .xls Excel dosyalarından görselleri çıkarmayı test eder.</p>
  
  <input type="file" id="fileInput" accept=".xls,.xlsx" />
  <button onclick="runTest()">🚀 Dosyayı Test Et</button>
  <button onclick="clearLog()">🗑️ Temizle</button>
  
  <div class="log" id="log"></div>
  <div class="images" id="images"></div>

  <script>
    const logEl = document.getElementById('log');
    const imagesEl = document.getElementById('images');

    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString('tr-TR');
      logEl.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      logEl.innerHTML = '';
      imagesEl.innerHTML = '';
    }

    // .XLS GÖRSEL ÇIKARMA FONKSİYONU - RAW BINARY SCAN
    async function xlsExtractImages(buf) {
      const images = {};
      try {
        const arr = new Uint8Array(buf);
        const len = arr.length;
        
        log('📦 Binary .xls dosyasında görsel taraması başlıyor...', 'info');
        log(`📏 Dosya boyutu: ${len.toLocaleString()} byte`, 'info');
        log('━'.repeat(60), 'info');

        // JPEG signature taraması (0xFF 0xD8 0xFF)
        log('🔍 JPEG görselleri aranıyor...', 'info');
        let jpegCount = 0;
        let pos = 0;
        
        while (pos < len - 3) {
          if (arr[pos] === 0xFF && arr[pos+1] === 0xD8 && arr[pos+2] === 0xFF) {
            // JPEG başlangıcı bulundu, bitiş noktasını bul (0xFF 0xD9)
            let endPos = pos + 3;
            while (endPos < len - 1) {
              if (arr[endPos] === 0xFF && arr[endPos+1] === 0xD9) {
                endPos += 2;
                break;
              }
              endPos++;
            }
            
            if (endPos < len) {
              const imgData = arr.slice(pos, endPos);
              const size = imgData.length;
              
              log(`✅ JPEG #${jpegCount + 1} bulundu: offset=${pos.toLocaleString()}, size=${size.toLocaleString()} byte`, 'success');
              
              const blob = new Blob([imgData], { type: 'image/jpeg' });
              const url = URL.createObjectURL(blob);
              
              if (!images['Sheet1']) images['Sheet1'] = [];
              images['Sheet1'].push({
                name: `image_${jpegCount + 1}.jpg`,
                data: url,
                size: size,
                format: 'jpeg',
                offset: pos
              });
              
              jpegCount++;
              pos = endPos;
              continue;
            }
          }
          pos++;
        }

        log(`📊 Toplam JPEG: ${jpegCount}`, jpegCount > 0 ? 'success' : 'warn');
        log('━'.repeat(60), 'info');

        // PNG signature taraması (0x89 0x50 0x4E 0x47 0x0D 0x0A 0x1A 0x0A)
        log('🔍 PNG görselleri aranıyor...', 'info');
        let pngCount = 0;
        pos = 0;
        
        while (pos < len - 8) {
          if (arr[pos] === 0x89 && arr[pos+1] === 0x50 && arr[pos+2] === 0x4E && arr[pos+3] === 0x47 &&
              arr[pos+4] === 0x0D && arr[pos+5] === 0x0A && arr[pos+6] === 0x1A && arr[pos+7] === 0x0A) {
            // PNG başlangıcı bulundu, IEND chunk'ını bul
            let endPos = pos + 8;
            while (endPos < len - 12) {
              if (arr[endPos] === 0x49 && arr[endPos+1] === 0x45 && arr[endPos+2] === 0x4E && arr[endPos+3] === 0x44) {
                endPos += 8; // IEND chunk + CRC
                break;
              }
              endPos++;
            }
            
            if (endPos < len) {
              const imgData = arr.slice(pos, endPos);
              const size = imgData.length;
              
              log(`✅ PNG #${pngCount + 1} bulundu: offset=${pos.toLocaleString()}, size=${size.toLocaleString()} byte`, 'success');
              
              const blob = new Blob([imgData], { type: 'image/png' });
              const url = URL.createObjectURL(blob);
              
              if (!images['Sheet1']) images['Sheet1'] = [];
              images['Sheet1'].push({
                name: `image_${jpegCount + pngCount + 1}.png`,
                data: url,
                size: size,
                format: 'png',
                offset: pos
              });
              
              pngCount++;
              pos = endPos;
              continue;
            }
          }
          pos++;
        }

        log(`📊 Toplam PNG: ${pngCount}`, pngCount > 0 ? 'success' : 'warn');
        log('━'.repeat(60), 'info');

        const totalImages = jpegCount + pngCount;
        log(`🖼️ Toplam çıkarılan görsel: ${totalImages}`, totalImages > 0 ? 'success' : 'error');

      } catch (error) {
        log(`❌ Hata: ${error.message}`, 'error');
        console.error(error);
      }
      
      return images;
    }

    async function runTest() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        log('⚠️ Lütfen bir dosya seçin!', 'warn');
        return;
      }

      clearLog();
      log(`📂 Dosya: ${file.name}`, 'info');
      log(`📏 Boyut: ${file.size.toLocaleString()} byte`, 'info');
      log(`📅 Değiştirilme: ${new Date(file.lastModified).toLocaleString('tr-TR')}`, 'info');
      log('━'.repeat(60), 'info');

      try {
        // Dosyayı ArrayBuffer olarak oku
        const arrayBuffer = await file.arrayBuffer();
        log(`✓ Dosya bellekte yüklendi`, 'success');

        // .XLS mi kontrol et
        const arr = new Uint8Array(arrayBuffer);
        const isXLS = arr[0] === 0xD0 && arr[1] === 0xCF && arr[2] === 0x11 && arr[3] === 0xE0;
        const isXLSX = arr[0] === 0x50 && arr[1] === 0x4B && arr[2] === 0x03 && arr[3] === 0x04;

        if (isXLS) {
          log('✓ Format: .XLS (BIFF - Binary)', 'success');
        } else if (isXLSX) {
          log('✓ Format: .XLSX (ZIP)', 'success');
          log('⚠️ Bu test .XLS dosyaları içindir. .XLSX dosyası için farklı metod gerekir.', 'warn');
          return;
        } else {
          log('❌ Bilinmeyen dosya formatı!', 'error');
          return;
        }

        log('━'.repeat(60), 'info');

        // Görselleri çıkar
        const images = await xlsExtractImages(arrayBuffer);

        log('━'.repeat(60), 'info');

        // Sonuçları göster
        if (Object.keys(images).length === 0) {
          log('❌ Hiç görsel bulunamadı!', 'error');
          log('💡 Dosyada görsel olmayabilir veya farklı bir formatta saklanıyor olabilir.', 'warn');
        } else {
          for (const [sheet, imgs] of Object.entries(images)) {
            log(`📄 ${sheet}: ${imgs.length} görsel`, 'success');
            
            imgs.forEach((img, idx) => {
              const card = document.createElement('div');
              card.className = 'img-card';
              card.innerHTML = `
                <img src="${img.data}" alt="${img.name}">
                <div class="info">
                  <strong>${img.name}</strong><br>
                  ${img.format.toUpperCase()} - ${(img.size / 1024).toFixed(1)} KB
                </div>
              `;
              imagesEl.appendChild(card);
            });
          }
        }

      } catch (error) {
        log(`❌ Fatal Error: ${error.message}`, 'error');
        console.error(error);
      }
    }

    // Dosya seçildiğinde otomatik çalıştır
    document.getElementById('fileInput').addEventListener('change', function() {
      if (this.files.length > 0) {
        setTimeout(runTest, 100);
      }
    });

    log('✓ Sistem hazır. Lütfen bir .xls dosyası seçin.', 'success');
  </script>
</body>
</html>
